[build-system]

requires = ["setuptools>=61", "setuptools_scm[toml]>=6.2", "wheel"]

build-backend = 'setuptools.build_meta'

[project]
name = "carsus"
description = "Atomic Database for Astronomy"
readme = { file = "README.rst", content-type = "text/x-rst" }
authors = [
    { name = "TARDIS Collaboration", email = "wkerzendorf@gmail.com" },
]
license = { text = "BSD 3-Clause" }
requires-python = ">=3.6"
dependencies = [
    "astropy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://tardis-sn.github.io/carsus"

[project.optional-dependencies]
test = [
    "pytest-astropy",
]
docs = [
    "sphinx-astropy",
    "tomli; python_version < '3.11'",
]

[tool.setuptools]
zip-safe = false
license-files = ["licenses/LICENSE.rst"]

[tool.setuptools.packages.find]

[tool.setuptools.package-data]
carsus = ["data/*"]
"carsus.tests" = ["data/*"]

[tool.setuptools_scm]
write_to = "carsus/version.py"
write_to_template = """
# Note that we need to fall back to the hard-coded version if either
# setuptools_scm can't be imported or setuptools_scm can't determine the
# version, so we catch the generic 'Exception'.
try:
    from setuptools_scm import get_version
    version = get_version(root='..', relative_to=__file__)
except Exception:
    version = '{version}'
"""

[tool.pytest.ini_options]
testpaths = ["carsus", "docs"]
text_file_format = "rst"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "with_regression_data: mark tests as needing regression data path to run",
    "remote_data: mark tests as needing network access to run",
]

[tool.coverage.run]
omit = [
    "carsus/_astropy_init*",
    "carsus/conftest.py",
    "carsus/*setup_package*",
    "carsus/tests/*",
    "carsus/*/tests/*",
    "carsus/extern/*",
    "carsus/version*",
    "*/carsus/_astropy_init*",
    "*/carsus/conftest.py",
    "*/carsus/*setup_package*",
    "*/carsus/tests/*",
    "*/carsus/*/tests/*",
    "*/carsus/extern/*",
    "*/carsus/version*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except ImportError",
    "raise AssertionError",
    "raise NotImplementedError",
    "def main\\(.*\\):",
    "pragma: py{ignore_python_version}",
    "def _ipython_key_completions_",
    "def __repr__",
    "if self\\.debug",
    "if 0:",
    "if __name__ == .__main__.:",
]
omit = [
    "*__init__*",
    "*_astropy_init*",
    "*version*",
    "*tests*",
    "*conftest*",
    "*setup_package*",
]
ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.carsus.docs]
edit_on_github = false
github_project = "tardis-sn/carsus"

[tool.tox]
legacy_tox_ini = """
[tox]
envlist =
    py{36,37,38}-test{,-alldeps,-devdeps}{,-cov}
    py{36,37,38}-test-numpy{116,117,118}
    py{36,37,38}-test-astropy{30,40,lts}
    build_docs
    linkcheck
    codestyle
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
isolated_build = true
indexserver =
    NIGHTLY = https://pypi.anaconda.org/scipy-wheels-nightly/simple

[testenv]
# Suppress display of matplotlib plots generated during docs build
setenv = MPLBACKEND=agg

# Pass through the following environment variables which may be needed for the CI
passenv = HOME WINDIR LC_ALL LC_CTYPE CC CI TRAVIS

# Run the tests in a temporary directory to make sure that we don't import
# this package from the source tree
changedir = .tmp/{envname}

# tox environments are constructed with so-called 'factors' (or terms)
# separated by hyphens, e.g. test-devdeps-cov. Lines below starting with factor:
# will only take effect if that factor is included in the environment name. To
# see a list of example environments that can be run, along with a description,
# run:
#
#     tox -l -v
#
description =
    run tests
    alldeps: with all optional dependencies
    devdeps: with the latest developer version of key dependencies
    oldestdeps: with the oldest supported version of key dependencies
    cov: and test coverage
    numpy116: with numpy 1.16.*
    numpy117: with numpy 1.17.*
    numpy118: with numpy 1.18.*
    astropy30: with astropy 3.0.*
    astropy40: with astropy 4.0.*
    astropylts: with the latest astropy LTS

# The following provides some specific pinnings for key packages
deps =

    cov: coverage
    numpy116: numpy==1.16.*
    numpy117: numpy==1.17.*
    numpy118: numpy==1.18.*

    astropy30: astropy==3.0.*
    astropy40: astropy==4.0.*
    astropylts: astropy==4.0.*

    devdeps: :NIGHTLY:numpy
    devdeps: git+https://github.com/astropy/astropy.git#egg=astropy

# The following indicates which optional dependencies from pyproject.toml will be installed
extras =
    test
    alldeps: all

commands =
    pip freeze
    !cov: pytest --pyargs carsus {toxinidir}/docs {posargs}
    cov: pytest --pyargs carsus {toxinidir}/docs --cov carsus --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml

[testenv:build_docs]
changedir = docs
description = invoke sphinx-build to build the HTML docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b html . _build/html

[testenv:linkcheck]
changedir = docs
description = check the links in the HTML docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b linkcheck . _build/html

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style, e.g. with flake8
deps = flake8
commands = flake8 carsus --count --max-line-length=100
"""

[tool.git-cliff.changelog]
header = "## Changelog\n\n"
body = """
### {{version}} ({{ timestamp | date(format="%Y/%m/%d %H:%M", timezone="America/New_York") }})
{% for commit in commits %}
    {%- if commit.github.pr_number -%}
  - [{{commit.github.pr_number}}](https://github.com/tardis-sn/carsus/pull/{{commit.github.pr_number}}) {{ commit.github.pr_title | split(pat="\n") | first | trim }} ({{commit.github.pr_number}}) (@{{ commit.github.username }})
    {% endif -%}
{%- endfor -%}
"""
trim = true
footer = "<!-- generated by git-cliff -->"

[tool.git-cliff.git]
conventional_commits = false
filter_unconventional = false
sort_commits = "newest"

[tool.git-cliff.remote.github]
owner = "tardis-sn"
repo = "carsus"
