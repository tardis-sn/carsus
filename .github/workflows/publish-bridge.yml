name: publish-bridge
run-name: publish bridge comparison · ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: [tardis-carsus-bridge]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: main
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      # the bridge uploads this artifact only when the regenerated regression data differs
      - name: Download comparison notebook
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          name: Comparison Notebook
          path: ${{ runner.temp }}/comparison-artifacts

      - name: Deploy to GitHub Pages
        if: steps.download.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.BOT_TOKEN }}
          publish_branch: ${{ env.DEPLOY_BRANCH }}
          publish_dir: ${{ runner.temp }}/comparison-artifacts
          destination_dir: carsus/pull/${{ env.PR_NUMBER }}
          keep_files: true
          external_repository: tardis-sn/reg-data-comp
          user_name: "TARDIS Bot"
          user_email: "tardis.sn.bot@gmail.com"

      - name: Find Comment
        if: steps.download.outcome == 'success'
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ env.PR_NUMBER }}
          body-includes: Carsus Bridge Regression Comparison

      - name: Post comment
        if: steps.download.outcome == 'success'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.BOT_TOKEN }}
          issue-number: ${{ env.PR_NUMBER }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ### Carsus Bridge Regression Comparison

            Regenerating TARDIS regression data with the new carsus atom data produced a diff. Full HTML comparison:

            - [compare_regression_data.html](https://tardis-sn.github.io/reg-data-comp/carsus/pull/${{ env.PR_NUMBER }}/compare_regression_data.html)

            Runs: [bridge](${{ github.event.workflow_run.html_url }}) · [publish](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
