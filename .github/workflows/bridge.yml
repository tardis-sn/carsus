name: tardis-carsus-bridge

on:
  workflow_call: # to be called by save_atomic_files workflow
    outputs:
      ref-check-trig:
        value: ${{ jobs.tardis-build.outputs.step-ref-check-trig}}
  workflow_dispatch: # for running manually
  pull_request: # run on PRs to validate atom-data changes against tardis regression data

        
env:
  XUVTOP: /tmp/chianti
  CHIANTI_DL_URL: https://download.chiantidatabase.org
  CHIANTI_DB_VER: CHIANTI_v9.0.1_database.tar.gz
  NBCONVERT_FLAGS: --execute --ExecutePreprocessor.timeout=600 --to html
  CMFGEN_DATA_REPO: tardis-sn/carsus-data-cmfgen
  PYTEST_FLAGS: --tardis-regression-data=${{ github.workspace }}/tardis-regression-data
                --generate-reference
  CACHE_NUMBER: 1

defaults:
      run:
        shell: bash -l {0}

jobs:
  carsus-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          path: carsus/
        
      - uses: actions/cache@v5
        with:
          path: ${{ env.XUVTOP }}
          key: ${{ runner.os }}-${{ env.CHIANTI_DB_VER }}
        id: chianti-cache

      - name: Download Chianti database
        run: |
            mkdir -p ${{ env.XUVTOP }}
            wget -q ${{ env.CHIANTI_DL_URL }}/${{ env.CHIANTI_DB_VER }} -O ${{ env.XUVTOP }}/chianti.tar.gz
            tar -zxf ${{ env.XUVTOP }}/chianti.tar.gz -C ${{ env.XUVTOP }}
        if: steps.chianti-cache.outputs.cache-hit != 'true'
      
      - name: Clone CMFGEN data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CMFGEN_DATA_REPO }}
          path: carsus-data-cmfgen

      - name: Setup CMFGEN data path
        run: ln -s ${{ github.workspace }}/carsus-data-cmfgen/atomic /tmp/atomic

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: carsus/conda-lock.yml
          init-shell: bash
          cache-environment: true
          cache-downloads: true 
          environment-name: carsus

      - name: Install package
        run: pip install -e carsus/

      - name: Run notebooks
        run: |
          jupyter nbconvert ${{ env.NBCONVERT_FLAGS }} carsus/docs/tardis_atomdata_ref.ipynb
        env:
          CARSUS_REFDATA: ${{ github.workspace }}/carsus-refdata
        
      - name: Upload Atom Data
        uses: actions/upload-artifact@v4
        with:
          name: atom-data
          path: carsus/docs/kurucz_cd23_cmfgen_H_Si.h5
  
  tardis-build:
    needs: carsus-build
    runs-on: ubuntu-latest
    outputs:
      step-ref-check-trig: ${{ steps.ref-equal-check.outcome }} # success or failure of refdata comparison

    steps:
      - uses: actions/checkout@v2
        with:
          repository: tardis-sn/tardis

      - name: Checkout carsus
        uses: actions/checkout@v2
        with:
          path: carsus

      - name: Checkout tardisbase
        uses: actions/checkout@v2
        with:
          repository: tardis-sn/tardisbase
          path: tardisbase

      - name: Clone tardis-sn/tardis-regression-data
        uses: actions/checkout@v4
        with:
          repository: tardis-sn/tardis-regression-data
          path: tardis-regression-data
          lfs: false

      - name: Git LFS Pull (via .lfsconfig in repo)
        run: git lfs pull
        working-directory: tardis-regression-data

      - name: Setup TARDIS environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda-linux-64.lock
          environment-name: tardis
          cache-environment: false
          cache-downloads: false

      - name: Install package
        run: pip install -e .

      - name: Install tardisbase
        run: pip install -e .
        working-directory: tardisbase

      - name: Install lineid_plot
        run: pip install --no-deps lineid_plot

      - name: Install GitPython
        run: pip install GitPython

      - name: Download atom data
        uses: actions/download-artifact@v4.1.7
        with:
          name: atom-data
          path: carsus/docs/kurucz_cd23_cmfgen_H_Si.h5
      
      - name: Replace Atomic Data
        run: cp carsus/docs/kurucz_cd23_cmfgen_H_Si.h5/kurucz_cd23_cmfgen_H_Si.h5 tardis-regression-data/atom_data/kurucz_cd23_cmfgen_H_Si.h5

      - name: Generate New Reference Data
        run: pytest tardis ${{ env.PYTEST_FLAGS }}

      - name: Check if reference data are equal
        id: ref-equal-check
        continue-on-error: true
        run: |
            if [ -n "$(git status --porcelain)" ]; then
              echo "Regression data differs after regeneration:"
              git status
              exit 1
            fi
        working-directory: tardis-regression-data

      - name: Snapshot regenerated regression data
        if: steps.ref-equal-check.outcome == 'failure'
        run: |
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add -A
            git commit -m "CI snapshot: regenerated with new carsus atom data"
        working-directory: tardis-regression-data

      - name: Compare regression data
        if: steps.ref-equal-check.outcome == 'failure'
        run: |
            jupyter nbconvert --execute --to html \
              ${{ github.workspace }}/tardisbase/tardisbase/testing/regression_comparison/compare_regression_data.ipynb \
              --output=${{ github.workspace }}/compare_regression_data.html
        env:
          REGRESSION_DATA_REPO: ${{ github.workspace }}/tardis-regression-data
          REF1_HASH: HEAD~1
          REF2_HASH: HEAD

      - name: Upload comparison notebook
        if: steps.ref-equal-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Comparison Notebook
          path: compare_regression_data.html

      # continue-on-error check would display a green tick even when the step passes
      # but is necessary for other steps to run
      # if the workflow was called by save-atomic-files workflow(the only other option)
      # and refdata comparison failed this workflow would pass but the
      # bridge-ref-check job in save-atomic-files about refdata comparison would fail
      - name: Fail the workflow if reference data check fails
        if: github.event_name == 'workflow_dispatch' && steps.ref-equal-check.outcome == 'failure'
        run: exit 1

  deploy-comparison:
    needs: tardis-build
    if: needs.tardis-build.outputs.step-ref-check-trig == 'failure'
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: main
    steps:
      - name: Download comparison notebook
        uses: actions/download-artifact@v4.1.7
        with:
          name: Comparison Notebook
          path: comparison-artifacts

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.BOT_TOKEN }}
          publish_branch: ${{ env.DEPLOY_BRANCH }}
          publish_dir: comparison-artifacts
          destination_dir: carsus/pull/${{ github.event.number || 477 }}
          keep_files: true
          external_repository: tardis-sn/reg-data-comp
          user_name: "TARDIS Bot"
          user_email: "tardis.sn.bot@gmail.com"

      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.number || 477 }}
          body-includes: Carsus Bridge Regression Comparison

      - name: Post comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.BOT_TOKEN }}
          issue-number: ${{ github.event.number || 477 }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ### Carsus Bridge Regression Comparison

            Regenerating TARDIS regression data with the new carsus atom data produced a diff. Full HTML comparison:

            - [compare_regression_data.html](https://tardis-sn.github.io/reg-data-comp/carsus/pull/${{ github.event.number || 477 }}/compare_regression_data.html)

            Artifacts from this run are also available in the [Actions run](${{ env.ARTIFACT_URL }}).
        env:
          ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
